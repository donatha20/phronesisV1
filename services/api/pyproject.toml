[project]
name = "phronesis-api"
version = "0.1.0"
description = "Phronesis Mentorship backend API (Django + DRF)."
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
ignore = ["E501", "C408"]  # C408: `defaults=dict(...)` is a readable Django idiom

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-q --reuse-db"
filterwarnings = [
    "ignore::UserWarning:dj_rest_auth.registration.serializers",
    "ignore:.*AUTHENTICATION_METHOD.*:DeprecationWarning",
]
